name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests on TVPO
    runs-on: [self-hosted, linux, x64, tvpo]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -v

  deploy:
    name: Deploy to TVPO
    needs: test
    runs-on: [self-hosted, linux, x64, tvpo]
    concurrency: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy and verify application
        run: bash deploy.sh
