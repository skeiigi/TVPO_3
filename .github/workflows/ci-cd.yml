name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -v

  deployment_ready:
    name: Ready for TVPO deployment
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Mark tested revision as deployable
        run: echo "Commit $GITHUB_SHA passed all tests and is ready for TVPO"
